<a class="featured-project" [routerLink]="project().projectRoute">
  <div class="featured-project__image-wrapper">
    <div class="featured-project__images">
      <img
        class="featured-project__image featured-project__image--desktop"
        [src]="project().images.desktop.src"
        [srcset]="project().images.desktop.srcset"
        [sizes]="project().images.desktop.sizes"
        [attr.width]="project().images.desktop.width"
        [attr.height]="project().images.desktop.height"
        [alt]="project().images.desktop.alt"
        [attr.loading]="loading()"
        [attr.fetchpriority]="fetchpriority()"
        decoding="async"
      />
      <img
        class="featured-project__image featured-project__image--mobile"
        [src]="project().images.mobile.src"
        [srcset]="project().images.mobile.srcset"
        [sizes]="project().images.mobile.sizes"
        [attr.width]="project().images.mobile.width"
        [attr.height]="project().images.mobile.height"
        [alt]="project().images.mobile.alt"
        [attr.loading]="loading()"
        decoding="async"
      />
      <img
        class="featured-project__image featured-project__image--tablet"
        [src]="project().images.tablet.src"
        [srcset]="project().images.tablet.srcset"
        [sizes]="project().images.tablet.sizes"
        [attr.width]="project().images.tablet.width"
        [attr.height]="project().images.tablet.height"
        [alt]="project().images.tablet.alt"
        [attr.loading]="loading()"
        decoding="async"
      />
    </div>
  </div>

  <div class="featured-project__footer">
    <p class="featured-project__name">{{ project().name }}</p>
    <span class="material-symbols-outlined featured-project__icon">{{ project().footerIcon }}</span>
  </div>

  <div class="featured-project__badge">
    <span class="material-symbols-outlined featured-project__icon featured-project__icon--badge">
      {{ project().badgeIcon }}
    </span>
  </div>
</a>
