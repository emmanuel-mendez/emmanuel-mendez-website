<main class="banner">
  <section class="banner__content">
    <div class="banner__info">
      <h1 class="banner__title">
        <span class="banner__title-line"
          >I'm <span class="banner__title-highlight">Emmanuel Mendez</span></span
        >
        {{ ' ' }}
        <span class="banner__title-line">Computer Engineer</span>
      </h1>
      <p class="banner__description">5+ years building high-performance web apps.</p>
    </div>
    <div class="banner__actions">
      <app-button [routerLink]="['/projects']" label="View projects" />
      <app-button appearance="secondary" type="button" label="Contact me" />
    </div>
  </section>

  <div class="banner__carousel-container">
    @if (isCarouselRendered()) {
      <owl-carousel-o
        #featuredProjectsCarousel
        class="banner__carousel"
        [options]="carouselOptions"
        (initialized)="onCarouselInitialized(featuredProjectsCarousel)"
        (change)="onCarouselChange()"
      >
        @for (project of featuredProjects; track $index) {
          <ng-template carouselSlide>
            <app-featured-project [project]="project"></app-featured-project>
          </ng-template>
        }
      </owl-carousel-o>
      <nav class="banner__carousel-controls" aria-label="Featured projects">
        <button
          class="banner__carousel-control"
          type="button"
          aria-label="Previous featured project"
          (click)="featuredProjectsCarousel.prev()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        </button>
        <button
          class="banner__carousel-control"
          type="button"
          aria-label="Next featured project"
          (click)="featuredProjectsCarousel.next()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
        </button>
      </nav>
    }
  </div>
</main>
