<main class="banner">
  <section class="banner__content">
    <div class="banner__info">
      <h1 class="banner__title">
        <span class="banner__title-line"
          >I'm <span class="banner__title-highlight">Emmanuel Mendez</span></span
        >
        {{ ' ' }}
        <span class="banner__title-line">Computer Engineer</span>
      </h1>
      <p class="banner__description">5+ years building high-performance web apps.</p>
    </div>
    <div class="banner__actions">
      <app-button [routerLink]="['/projects']" label="View projects" />
      <app-button appearance="secondary" type="button" label="Contact me" />
    </div>
  </section>

  <section class="banner__featured-projects-swiper" aria-label="Featured projects swiper">
    <div class="banner__featured-projects-swiper-viewport">
      <div
        class="banner__featured-projects-swiper-track"
        [class.banner__featured-projects-swiper-track--without-transition]="!withTransition()"
        [style.transform]="projectsTransform()"
        (transitionend)="handleSlideTransitionEnd()"
      >
        @for (project of featuredProjectsSlides; track project.name + $index) {
          <div class="banner__featured-projects-swiper-slide">
            <app-featured-project [project]="project"></app-featured-project>
          </div>
        }
      </div>
    </div>

    <div class="banner__featured-projects-swiper-controls">
      <button
        class="banner__featured-projects-swiper-button"
        type="button"
        aria-label="Show previous featured project"
        (click)="showPreviousProject()"
      >
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <div class="banner__featured-projects-swiper-pagination">
        @for (project of featuredProjects; track project.name; let projectIndex = $index) {
          <button
            class="banner__featured-projects-swiper-bullet"
            [class.banner__featured-projects-swiper-bullet--active]="
              activeProjectIndex() === projectIndex
            "
            type="button"
            [attr.aria-label]="'Show featured project: ' + project.name"
            (click)="selectProject(projectIndex)"
          ></button>
        }
      </div>
      <button
        class="banner__featured-projects-swiper-button"
        type="button"
        aria-label="Show next featured project"
        (click)="showNextProject()"
      >
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </section>
</main>
