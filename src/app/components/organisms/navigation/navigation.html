<nav class="navigation">
  @if (responsive.device() | includes: [breakpoints.DESKTOP]) {
    <ul class="navigation__list">
      @for (item of navigationItems; track item.href) {
        <li class="navigation__item">
          <a class="navigation__link" [href]="item.href">{{ item.label }}</a>
        </li>
      }
    </ul>
    <div class="navigation__theme-picker">
      <app-theme-picker />
    </div>
  } @else {
    <app-theme-picker />

    <app-button class="navigation__button" appearance="plain" type="button" (click)="toggleMenu()">
      <span class="material-symbols-outlined navigation__icon">{{
        opened() ? 'close' : 'menu'
      }}</span>
    </app-button>

    @if (opened()) {
      <ul class="navigation__menu">
        @for (item of navigationItems; track item.href) {
          <li class="navigation__item">
            <a class="navigation__link" [href]="item.href" (click)="closeMenu()">{{
              item.label
            }}</a>
          </li>
        }
      </ul>

      <app-button
        class="navigation__backdrop"
        appearance="plain"
        type="button"
        aria-label="Close navigation menu"
        (click)="closeMenu()"
      ></app-button>
    }
  }
</nav>
