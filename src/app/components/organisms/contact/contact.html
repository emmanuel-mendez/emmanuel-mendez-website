<section class="contact section">
  <h2 class="contact__title">Contact</h2>
  <p class="contact__subtitle">
    Looking for a dedicated professional to join your team? Send me a message.
  </p>

  @if (status() === 'sent') {
    <div class="contact__feedback contact__feedback--sent" role="status" aria-live="polite">
      <span class="material-symbols-outlined contact__feedback-icon">check_circle</span>
      <p class="contact__feedback-text">Message sent successfully!</p>
      <button class="contact__reset" type="button" (click)="reset()">Send another message</button>
    </div>
  } @else if (status() === 'error') {
    <div class="contact__feedback contact__feedback--error" role="alert" aria-live="assertive">
      <span class="material-symbols-outlined contact__feedback-icon">error</span>
      <p class="contact__feedback-text">An error occurred. Please try again.</p>
      <button class="contact__reset" type="button" (click)="reset()">Try again</button>
    </div>
  } @else {
    <form class="contact__form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
      <div class="contact__field">
        <label class="contact__label" for="contact-name">Name</label>
        <input
          class="contact__input"
          id="contact-name"
          type="text"
          name="name"
          [(ngModel)]="name"
          required
          placeholder="Your full name"
        />
      </div>

      <div class="contact__field">
        <label class="contact__label" for="contact-email">Email address</label>
        <input
          class="contact__input"
          id="contact-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="you@example.com"
        />
      </div>

      <div class="contact__field">
        <label class="contact__label" for="contact-message">Message</label>
        <textarea
          class="contact__input contact__input--textarea"
          id="contact-message"
          name="message"
          [(ngModel)]="message"
          required
          placeholder="Write your message here..."
          rows="5"
        ></textarea>
      </div>

      <button
        class="contact__button"
        type="submit"
        [disabled]="status() === 'sending' || contactForm.invalid"
      >
        @if (status() === 'sending') {
          Sending...
        } @else {
          Send
        }
      </button>
    </form>
  }
</section>
