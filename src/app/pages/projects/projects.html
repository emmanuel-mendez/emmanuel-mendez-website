<app-layout>
  <section class="projects">
    <h1 class="projects__title">Projects</h1>
    <button
      class="projects__filter-trigger"
      type="button"
      aria-haspopup="dialog"
      [attr.aria-expanded]="isFilterDialogOpen()"
      (click)="openFilterDialog()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">tune</span>
      Filter
    </button>
    <div class="projects__content">
      @if (isFilterDialogOpen()) {
        <button
          class="projects__backdrop"
          type="button"
          aria-label="Close project filters"
          (click)="closeFilterDialog()"
        ></button>
      }
      <div
        class="projects__filter-panel"
        [class.projects__filter-panel--open]="isFilterDialogOpen()"
        [attr.role]="isFilterDialogOpen() ? 'dialog' : null"
        [attr.aria-modal]="isFilterDialogOpen() ? 'true' : null"
        aria-labelledby="projects-filter-heading"
        tabindex="-1"
        (keydown.escape)="closeFilterDialog()"
      >
        <div class="projects__filter-dialog-header">
          <button
            class="projects__filter-close"
            type="button"
            aria-label="Close project filters"
            (click)="closeFilterDialog()"
          >
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
          </button>
        </div>
        <app-filter
          [list]="projects"
          [categories]="categories()"
          [sortProperties]="sortProperties"
          [sortProperty]="sort()"
          (filteredListChange)="setFilteredProjects($event)"
          (sortPropertyChange)="setSort($event)"
        />
      </div>
      <div class="projects__results">
        @if (displayedProjects().length) {
          <div class="projects__grid">
            <app-pagination
              [items]="displayedProjects()"
              [itemTemplate]="projectTemplate"
              [itemsPerPage]="6"
              [currentPage]="page()"
              [showPageControls]="true"
              (pageChange)="setPage($event)"
            />
          </div>
        } @else {
          <p class="projects__empty">No projects match these filters.</p>
        }
      </div>
    </div>
    <ng-template #projectTemplate let-project>
      <app-card [project]="project" />
    </ng-template>
  </section>
</app-layout>
